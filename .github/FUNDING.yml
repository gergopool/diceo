# GitHub reads this file and puts a "Sponsor" button at the top of the repository.
#
# WHATEVER IS ENABLED HERE, THE TIERS GIVE NOTHING IN RETURN. No logo in the README, no
# name in a backers file, no priority support, no perks of any kind. A perk is a supply
# for VAT purposes and an unconditional donation is not, which makes this a hard
# constraint with a tax reason behind it rather than a stylistic one. The reasoning is
# D21 in the research repository's docs/decisions.md.
#
# On Buy Me a Coffee specifically that means: **Memberships off, Extras/Shop off.** Both
# sell something, which is exactly the line D21 exists to keep us behind. A one-off
# "coffee" with no reward attached is the only thing this page should offer. Its public
# supporter feed is fine -- a supporter choosing to be visible is not us promising them
# recognition.
#
# **GitHub Sponsors tiers must have no rewards either.** Sponsors invites you to attach
# benefits to each tier and that is precisely what D21 forbids; a tier carrying only a
# description and nothing deliverable is fine. This is the one setting here that lives on
# GitHub rather than in this file, so it cannot be reviewed by reading the repository --
# check it on the Sponsors dashboard when changing anything.
#
# Both are enabled, which is a change from the original "one is enough". That earlier note
# said not to switch to GitHub Sponsors on fee grounds alone, and this is not that: Sponsors
# simply did not exist for this account when the choice was made. Buy Me a Coffee stays
# because it is the page people recognise and its ~5% is 5% of a small number; Sponsors is
# added because it takes nothing from individuals and is the one a company's finance
# department can actually pay against an invoice. Two buttons, no perks behind either.
#
# Each handle must match the one in that platform's own URL (buymeacoffee.com/<handle>,
# github.com/sponsors/<handle>). A funding link that 404s is worse than no button at all.
# Nothing renders until the repository is public.

github: gergopool
buy_me_a_coffee: gergopool

# Considered and not enabled:
# ko_fi: gergopool           # 0% platform fee, processor cut only
# open_collective: diceo     # transparent ledger; worth it only if companies fund this
