<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="940" height="580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Retrieval quality against throughput for 3 document extraction tools averaged across PDF, DOCX, PPTX, HTML, each drawn at three chunk sizes. Throughput is on a logarithmic horizontal axis, so further right is faster and higher is better. Measured on PDF + DOCX + PPTX + HTML, macro mean of the four · throughput for one document of each · XLSX measured but excluded on purpose, with every arm chunked by Diceo's splitter so the chunk-size aims mean the same thing on every line.">
